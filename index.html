<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Ferramente de produtividade para escritores acompanharem seu progresso">
        <title>Word Loom</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Word Loom</h1>
            <nav>
                <a href="index.html">Word Loom</a> |
                <a href="meta.html">Estabecer e Acompanhar Metas</a> |
                <a href="about.html">Sobre a Pagina</a>
            </nav>
        </header>
        <main>
            <fieldset>
                <h2>Espaço de Criação</h2>
                <div class="botoes-container">
                <select id="zoom-select" class="btn-estilizado">
                    <option value="0.5">50%</option>
                    <option value="0.75">75%</option>
                    <option value="0.9">90%</option>
                    <option value="1" selected>100%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                    <option value="2">200%</option>
                 </select>
    <button id="baixar">Baixar texto (.txt)</button>
    <button id="apagar">Apagar Texto Salvo</button>
</div>
                <p id="progresso"></p>
                <p class="progresso" id="contador">Palavras Escritas: 0</p>
                <div id="editor-viewport">
                    <div id="editor-espaco">
                        <div id="texto" contenteditable="true"></div>
                    </div>
                </div>
            </fieldset>
        </main>
    <footer>
         <p class="footer">2026 WordLoom</p>
    </footer>
        <script src="script.js"></script>
    </body>
</html>
